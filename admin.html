<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖淡江演唱會 - 領票管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { 
      background-color: #080312; 
      color: #f8fafc; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-image: 
        radial-gradient(circle at 80% 20%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%),
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
    }
    .neon-text-pink { text-shadow: 0 0 8px rgba(236, 72, 153, 0.8); }
    .neon-text-cyan { text-shadow: 0 0 8px rgba(6, 182, 212, 0.8); }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="min-h-screen p-4 md:p-8">
  <!-- 登入驗證 Modal -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur flex items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-pink-500/50 p-6 rounded-2xl w-full max-w-md text-center space-y-4 shadow-2xl shadow-pink-500/20">
      <div class="text-pink-500 text-4xl neon-text-pink"><i class="fa-solid fa-user-shield"></i></div>
      <h2 class="text-xl font-bold font-mono tracking-wider text-pink-400">ADMIN SYSTEM LOGIN</h2>
      <input type="password" id="admin-pass" placeholder="密碼 (預設: tku2026)" 
        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-center focus:outline-none focus:border-cyan-400 font-mono">
      <button onclick="login()" class="w-full bg-gradient-to-r from-pink-600 to-cyan-500 hover:from-pink-500 hover:to-cyan-400 text-white font-black py-3 rounded-xl font-mono tracking-wider uppercase shadow-lg shadow-pink-500/20">
        ACCESS SYSTEM
      </button>
    </div>
  </div>

  <!-- 後台主儀表板 -->
  <div id="admin-content" class="max-w-5xl mx-auto space-y-6 hidden">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-black text-pink-400 neon-text-pink tracking-wider">聖淡江演唱會 ｜ 現場領票核對後台</h1>
        <p class="text-xs text-slate-400 font-mono">核對學生證正本後發放紙本票券 // VERIFY STUDENT ID</p>
      </div>
      <div class="flex gap-2 font-mono">
        <button onclick="location.reload()" class="bg-slate-900 hover:bg-slate-800 text-xs px-3 py-2 rounded-lg border border-slate-700 text-slate-300">
          <i class="fa-solid fa-rotate-right mr-1"></i> REFRESH
        </button>
        <button onclick="clearAllData()" class="bg-red-950/60 hover:bg-red-900/80 border border-red-500/50 text-red-400 text-xs px-3 py-2 rounded-lg">
          <i class="fa-solid fa-trash-can mr-1"></i> RESET SYSTEM
        </button>
      </div>
    </div>

    <!-- 數據看板 -->
    <div class="grid grid-cols-3 gap-4 font-mono">
      <div class="bg-slate-900/80 p-4 rounded-xl border border-pink-500/30 text-center">
        <div class="text-xs text-slate-400 mb-1">TOTAL ORDERS / 總索票筆數</div>
        <div id="stat-total-orders" class="text-2xl font-bold text-pink-400 neon-text-pink">0</div>
      </div>
      <div class="bg-slate-900/80 p-4 rounded-xl border border-cyan-500/30 text-center">
        <div class="text-xs text-slate-400 mb-1">CLAIMED / 已發放紙本票</div>
        <div id="stat-claimed-tickets" class="text-2xl font-bold text-cyan-400 neon-text-cyan">0</div>
      </div>
      <div class="bg-slate-900/80 p-4 rounded-xl border border-purple-500/30 text-center">
        <div class="text-xs text-slate-400 mb-1">UNCLAIMED / 未領取票數</div>
        <div id="stat-unclaimed-tickets" class="text-2xl font-bold text-purple-400">0</div>
      </div>
    </div>

    <!-- 搜尋欄 -->
    <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl flex gap-3">
      <input type="text" id="search-input" placeholder="搜尋學號、姓名或憑證號碼 (例如: 411650123)" 
        class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-400 font-mono">
      <button onclick="renderOrders()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black px-6 py-2 rounded-lg font-mono uppercase">
        SEARCH
      </button>
    </div>

    <!-- 訂單列表 -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-950 text-slate-400 border-b border-slate-800 font-mono text-xs">
            <tr>
              <th class="p-4">PASS ID</th>
              <th class="p-4">STUDENT ID</th>
              <th class="p-4">NAME</th>
              <th class="p-4">TICKET TYPE</th>
              <th class="p-4">TIME</th>
              <th class="p-4">STATUS</th>
              <th class="p-4">ACTION</th>
            </tr>
          </thead>
          <tbody id="orders-list" class="divide-y divide-slate-800 text-slate-300">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD_BBnH0OJucP_CArSNw4KG_TL6ctIxshI",
      authDomain: "tku-12a7b.firebaseapp.com",
      databaseURL: "https://tku-12a7b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tku-12a7b",
      storageBucket: "tku-12a7b.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:603121666440:web:ee2ea8d25f07a64000d23d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let dbData = { inventory: { '1F': 1500, '2F': 500 }, orders: {} };

    function login() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === 'tku2026') {
        document.getElementById('auth-modal').classList.add('hidden');
        document.getElementById('admin-content').classList.remove('hidden');
        
        db.ref('tku_concert').on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            dbData = val;
            renderOrders();
          }
        });
      } else {
        alert('密碼錯誤！預設密碼為：tku2026');
      }
    }

    function renderOrders() {
      const ordersArray = dbData.orders ? Object.values(dbData.orders) : [];
      const keyword = document.getElementById('search-input').value.trim().toUpperCase();
      const tbody = document.getElementById('orders-list');
      
      document.getElementById('stat-total-orders').innerText = ordersArray.length;
      const claimedTickets = ordersArray.filter(o => o.claimedPaperTicket).reduce((sum, o) => sum + o.qty, 0);
      const totalTickets = ordersArray.reduce((sum, o) => sum + o.qty, 0);
      document.getElementById('stat-claimed-tickets').innerText = claimedTickets;
      document.getElementById('stat-unclaimed-tickets').innerText = totalTickets - claimedTickets;

      const filtered = ordersArray.filter(o => 
        o.studentId.includes(keyword) || o.passId.includes(keyword) || o.name.includes(keyword)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500 font-mono">NO RECORDS FOUND</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(o => `
        <tr class="hover:bg-slate-800/50">
          <td class="p-4 font-mono text-pink-400 font-bold">${o.passId}</td>
          <td class="p-4 font-bold text-white font-mono">${o.studentId}</td>
          <td class="p-4">${o.name}</td>
          <td class="p-4"><span class="bg-slate-950 px-2.5 py-1 rounded border border-slate-700 text-xs">${o.seat} x ${o.qty}張</span></td>
          <td class="p-4 text-xs text-slate-400 font-mono">${o.createdAt}</td>
          <td class="p-4">
            ${o.claimedPaperTicket 
              ? `<span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/40 px-2.5 py-1 rounded-full text-xs font-semibold font-mono">已核發紙本票</span>`
              : `<span class="bg-pink-500/10 text-pink-400 border border-pink-500/40 px-2.5 py-1 rounded-full text-xs font-semibold font-mono">未領取</span>`
            }
          </td>
          <td class="p-4">
            ${o.claimedPaperTicket 
              ? `<span class="text-xs text-slate-500 font-mono">COMPLETED</span>`
              : `<button onclick="claimTicket('${o.passId}')" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs font-mono">
                  核對並領票
                 </button>`
            }
          </td>
        </tr>
      `).join('');
    }

    function claimTicket(passId) {
      const order = dbData.orders[passId];
      if (order && confirm(`確認學號：${order.studentId}（${order.name}）的學生證正本無誤，發放 ${order.qty} 張實體紙本票？`)) {
        db.ref(`tku_concert/orders/${passId}`).update({ claimedPaperTicket: true });
      }
    }

    function clearAllData() {
      const pass = prompt('【警告】此操作將清空所有索票紀錄並重置票數庫存！\n請輸入管理員密碼以確認：');
      if (pass === 'tku2026') {
        db.ref('tku_concert').set({
          inventory: { '1F': 1500, '2F': 500 },
          orders: {}
        });
        alert('系統已完成重置！所有紀錄已清空，票數已恢復至一樓1500張、二樓500張。');
      } else if (pass !== null) {
        alert('密碼錯誤，取消清除操作。');
      }
    }
  </script>
</body>
</html>
