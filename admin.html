<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖淡江演唱會 - 領票管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Special+Elite&display=swap');

    body { 
      background-color: #f7f4ed; /* 奶油白復古紙張底色 */
      color: #2b2b2b; 
      font-family: 'Noto Serif TC', serif, -apple-system, sans-serif;
      background-image: 
        radial-gradient(circle at 80% 20%, rgba(27, 67, 50, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(155, 34, 38, 0.05) 0%, transparent 40%),
        linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 20px 20px, 20px 20px;
    }
    
    .retro-card { 
      background: #fffdf9; 
      border: 3px solid #1b4332;
      box-shadow: 6px 6px 0px rgba(155, 34, 38, 0.8);
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="min-h-screen p-4 md:p-8">
  <!-- 登入驗證 Modal -->
  <div id="auth-modal" class="fixed inset-0 bg-[#f7f4ed]/90 backdrop-blur flex items-center justify-center z-50 p-4">
    <div class="retro-card p-6 rounded-2xl w-full max-w-md text-center space-y-4">
      <div class="text-[#9b2226] text-4xl"><i class="fa-solid fa-user-shield"></i></div>
      <h2 class="text-xl font-bold font-mono tracking-wider text-[#9b2226]">ADMIN SYSTEM LOGIN</h2>
      <input type="password" id="admin-pass" placeholder="密碼 (預設: tku2026)" 
        onkeydown="if(event.key==='Enter') login()"
        class="w-full bg-[#f7f4ed] border-2 border-slate-400 rounded-xl px-4 py-3 text-slate-900 text-center focus:outline-none focus:border-[#1b4332] font-mono">
      <button onclick="login()" class="w-full bg-[#9b2226] hover:bg-[#7b1b1e] text-white font-black py-3 rounded-xl font-mono tracking-wider uppercase shadow-md">
        ACCESS SYSTEM
      </button>
    </div>
  </div>

  <!-- 後台主儀表板 -->
  <div id="admin-content" class="max-w-5xl mx-auto space-y-6 hidden">
    <div class="flex justify-between items-center border-b-2 border-slate-300 pb-4">
      <div>
        <h1 class="text-2xl font-black text-[#9b2226] tracking-wider">聖淡江演唱會 ｜ 現場領票核對後台</h1>
        <p class="text-xs text-[#1b4332] font-mono font-bold">核對學生證正本後發放紙本票券 // VERIFY STUDENT ID</p>
      </div>
      <div class="flex gap-2 font-mono">
        <button onclick="location.reload()" class="bg-[#fffdf9] hover:bg-slate-100 text-xs px-3 py-2 rounded-lg border-2 border-slate-400 text-slate-700 font-bold">
          <i class="fa-solid fa-rotate-right mr-1"></i> REFRESH
        </button>
        <button onclick="clearAllData()" class="bg-red-100 hover:bg-red-200 border-2 border-red-500 text-red-700 text-xs px-3 py-2 rounded-lg font-bold">
          <i class="fa-solid fa-trash-can mr-1"></i> RESET SYSTEM
        </button>
      </div>
    </div>

    <!-- 數據看板 -->
    <div class="grid grid-cols-3 gap-4 font-mono">
      <div class="bg-[#fffdf9] p-4 rounded-xl border-2 border-[#9b2226] text-center shadow-sm">
        <div class="text-xs text-slate-600 mb-1 font-bold">TOTAL ORDERS / 總索票筆數</div>
        <div id="stat-total-orders" class="text-2xl font-bold text-[#9b2226]">0</div>
      </div>
      <div class="bg-[#fffdf9] p-4 rounded-xl border-2 border-[#1b4332] text-center shadow-sm">
        <div class="text-xs text-slate-600 mb-1 font-bold">CLAIMED / 已發放紙本票</div>
        <div id="stat-claimed-tickets" class="text-2xl font-bold text-[#1b4332]">0</div>
      </div>
      <div class="bg-[#fffdf9] p-4 rounded-xl border-2 border-amber-600 text-center shadow-sm">
        <div class="text-xs text-slate-600 mb-1 font-bold">UNCLAIMED / 未領取票數</div>
        <div id="stat-unclaimed-tickets" class="text-2xl font-bold text-amber-700">0</div>
      </div>
    </div>

    <!-- 搜尋與過濾欄 -->
    <div class="bg-[#fffdf9] border-2 border-slate-300 p-4 rounded-xl flex flex-col md:flex-row gap-3 shadow-sm">
      <input type="text" id="search-input" placeholder="搜尋學號、姓名或憑證號碼 (例如: 411650123)" 
        onkeydown="if(event.key==='Enter') renderOrders()"
        class="flex-1 bg-[#f7f4ed] border-2 border-slate-400 rounded-lg px-4 py-2 text-slate-900 focus:outline-none focus:border-[#1b4332] font-mono">
      
      <select id="status-filter" onchange="renderOrders()" class="bg-[#f7f4ed] border-2 border-slate-400 rounded-lg px-4 py-2 text-slate-800 font-mono focus:outline-none focus:border-[#1b4332]">
        <option value="ALL">全部狀態 (ALL)</option>
        <option value="UNCLAIMED">僅顯示 未領取 (UNCLAIMED)</option>
        <option value="CLAIMED">僅顯示 已領取 (CLAIMED)</option>
      </select>

      <button onclick="renderOrders()" class="bg-[#1b4332] hover:bg-[#122e22] text-white font-black px-6 py-2 rounded-lg font-mono uppercase shadow-sm">
        SEARCH
      </button>
    </div>

    <!-- 訂單列表 -->
    <div class="bg-[#fffdf9] border-2 border-slate-300 rounded-xl overflow-hidden shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-[#1b4332] text-white border-b border-slate-300 font-mono text-xs">
            <tr>
              <th class="p-4">PASS ID</th>
              <th class="p-4">STUDENT ID</th>
              <th class="p-4">NAME</th>
              <th class="p-4">TICKET TYPE</th>
              <th class="p-4">TIME</th>
              <th class="p-4">STATUS</th>
              <th class="p-4">ACTION</th>
            </tr>
          </thead>
          <tbody id="orders-list" class="divide-y divide-slate-200 text-slate-800">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD_BBnH0OJucP_CArSNw4KG_TL6ctIxshI",
      authDomain: "tku-12a7b.firebaseapp.com",
      databaseURL: "https://tku-12a7b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tku-12a7b",
      storageBucket: "tku-12a7b.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:603121666440:web:ee2ea8d25f07a64000d23d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let dbData = { inventory: { '1F': 1300, '2F': 500 }, orders: {} };

    function login() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === 'tku2026') {
        document.getElementById('auth-modal').classList.add('hidden');
        document.getElementById('admin-content').classList.remove('hidden');
        
        db.ref('tku_concert').on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            dbData = val;
            renderOrders();
          }
        });
      } else {
        alert('密碼錯誤！預設密碼為：tku2026');
      }
    }

    function renderOrders() {
      const ordersArray = dbData.orders ? Object.values(dbData.orders) : [];
      const keyword = document.getElementById('search-input').value.trim().toUpperCase();
      const statusFilter = document.getElementById('status-filter').value;
      const tbody = document.getElementById('orders-list');
      
      document.getElementById('stat-total-orders').innerText = ordersArray.length;
      const claimedTickets = ordersArray.filter(o => o.claimedPaperTicket).reduce((sum, o) => sum + (o.qty || 0), 0);
      const totalTickets = ordersArray.reduce((sum, o) => sum + (o.qty || 0), 0);
      document.getElementById('stat-claimed-tickets').innerText = claimedTickets;
      document.getElementById('stat-unclaimed-tickets').innerText = totalTickets - claimedTickets;

      const filtered = ordersArray.filter(o => {
        const matchesSearch = (o.studentId && o.studentId.includes(keyword)) ||
                              (o.passId && o.passId.includes(keyword)) ||
                              (o.name && o.name.includes(keyword));
        if (!matchesSearch) return false;

        if (statusFilter === 'CLAIMED') return o.claimedPaperTicket === true;
        if (statusFilter === 'UNCLAIMED') return !o.claimedPaperTicket;
        return true;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500 font-mono">NO RECORDS FOUND</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(o => `
        <tr class="hover:bg-slate-100 transition duration-150">
          <td class="p-4 font-mono text-[#9b2226] font-bold">${o.passId}</td>
          <td class="p-4 font-bold text-slate-900 font-mono">${o.studentId}</td>
          <td class="p-4">${o.name}</td>
          <td class="p-4"><span class="bg-[#f7f4ed] px-2.5 py-1 rounded border border-slate-300 text-xs font-bold">${o.seat} x ${o.qty}張</span></td>
          <td class="p-4 text-xs text-slate-500 font-mono">${o.createdAt || '-'}</td>
          <td class="p-4">
            ${o.claimedPaperTicket 
              ? `<span class="bg-green-100 text-[#1b4332] border border-[#1b4332]/40 px-2.5 py-1 rounded-full text-xs font-semibold font-mono">已核發紙本票</span>`
              : `<span class="bg-red-100 text-[#9b2226] border border-[#9b2226]/40 px-2.5 py-1 rounded-full text-xs font-semibold font-mono">未領取</span>`
            }
          </td>
          <td class="p-4">
            ${o.claimedPaperTicket 
              ? `<span class="text-xs text-slate-400 font-mono">COMPLETED</span>`
              : `<button onclick="claimTicket('${o.passId}')" class="bg-[#1b4332] hover:bg-[#122e22] text-white font-bold px-3 py-1.5 rounded-lg text-xs font-mono shadow-sm">
                  核對並領票
                 </button>`
            }
          </td>
        </tr>
      `).join('');
    }

    function claimTicket(passId) {
      const order = dbData.orders[passId];
      if (order && confirm(`確認學號：${order.studentId}（${order.name}）的學生證正本無誤，發放 ${order.qty} 張實體紙本票？`)) {
        db.ref(`tku_concert/orders/${passId}`).update({ claimedPaperTicket: true });
      }
    }

    function clearAllData() {
      const pass = prompt('【警告】此操作將清空所有索票紀錄並重置票數庫存！\n請輸入管理員密碼以確認：');
      if (pass === 'tku2026') {
        db.ref('tku_concert').set({
          inventory: { '1F': 1300, '2F': 500 },
          orders: {}
        });
        alert('系統已完成重置！所有紀錄已清空，票數已恢復至一樓1300張、二樓500張。');
      } else if (pass !== null) {
        alert('密碼錯誤，取消清除操作。');
      }
    }
  </script>
</body>
</html>
