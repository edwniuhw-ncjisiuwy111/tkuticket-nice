<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖淡江至校園演唱會 - 線上免費索票系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen pb-12">
  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur fixed top-0 w-full z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-[#00d26a] fa-holly-berry text-2xl text-emerald-400"></i>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-red-400 via-amber-200 to-emerald-400 bg-clip-text text-transparent">聖淡江至校園演唱會</h1>
          <p class="text-xs text-slate-400">淡江大學活動中心 ｜ 1,500席限定</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 pt-24 space-y-8">
    <!-- Banner -->
    <div class="glass-card rounded-2xl p-6 md:p-8 text-center relative overflow-hidden border-amber-500/30">
      <div class="inline-block bg-red-600/30 border border-red-500/50 text-red-300 text-xs px-3 py-1 rounded-full mb-3">
        <i class="fa-solid fa-[#00d26a] fa-gift mr-1"></i> 淡江學生限定 免費索票
      </div>
      <h2 class="text-3xl md:text-5xl font-black text-white tracking-wide mb-2">2026 聖淡江至演唱會</h2>
      <p class="text-slate-300 text-sm md:text-base max-w-xl mx-auto mb-6">請輸入學號完成線上登記，憑系統生成的領票憑證與學生證至指定地點領取實體紙本入場票。</p>
      
      <!-- Live Ticket Counter -->
      <div class="grid grid-cols-2 gap-4 max-w-md mx-auto">
        <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700">
          <div class="text-xs text-slate-400 mb-1">一樓自由站立席</div>
          <div class="text-2xl font-extrabold text-amber-400"><span id="floor1-left">1200</span> <span class="text-xs text-slate-500 font-normal">/ 1200 張</span></div>
        </div>
        <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700">
          <div class="text-xs text-slate-400 mb-1">二樓自由座席</div>
          <div class="text-2xl font-extrabold text-emerald-400"><span id="floor2-left">300</span> <span class="text-xs text-slate-500 font-normal">/ 300 張</span></div>
        </div>
      </div>
    </div>

    <!-- Booking Form -->
    <div class="glass-card rounded-2xl p-6 md:p-8 max-w-2xl mx-auto" id="booking-section">
      <h3 class="text-xl font-bold mb-6 flex items-center gap-2">
        <i class="fa-solid fa-ticket text-amber-400"></i> 線上登記索票
      </h3>
      
      <form id="ticket-form" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">淡江大學學號</label>
          <input type="text" id="student-id" placeholder="例如：411650123" required
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-400 uppercase">
          <p class="text-xs text-slate-400 mt-1">* 每個學號上限索取 4 張票</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">學生姓名</label>
          <input type="text" id="student-name" placeholder="請輸入姓名" required
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-400">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">選擇票種</label>
            <select id="seat-type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-400">
              <option value="1F">一樓自由站立席 (1200席)</option>
              <option value="2F">二樓自由座席 (300席)</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">張數 (1~4張)</label>
            <select id="ticket-qty" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-400">
              <option value="1">1 張</option>
              <option value="2">2 張</option>
              <option value="3">3 張</option>
              <option value="4">4 張</option>
            </select>
          </div>
        </div>

        <button type="submit" 
          class="w-full bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 font-bold py-4 rounded-xl shadow-lg transition duration-200">
          確認免費索票
        </button>
      </form>
    </div>

    <!-- Ticket Pass Result Modal/Card (Hidden by default) -->
    <div id="pass-container" class="hidden max-w-2xl mx-auto">
      <div class="glass-card rounded-2xl p-6 border-amber-500/50 bg-slate-900/90 text-center space-y-4">
        <div class="text-emerald-400 text-4xl mb-2"><i class="fa-solid fa-circle-check"></i></div>
        <h3 class="text-2xl font-bold text-white">索票成功！實體領票憑證</h3>
        <p class="text-xs text-slate-400">請拍照或截圖保存此憑證，至活動中心領取紙本入場票</p>
        
        <div class="bg-slate-800 p-4 rounded-xl text-left font-mono text-sm space-y-2 border border-slate-700">
          <div class="flex justify-between border-b border-slate-700 pb-2">
            <span class="text-slate-400">憑證編號:</span>
            <span id="pass-id" class="text-amber-400 font-bold">--</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400">淡江學號:</span>
            <span id="pass-student-id" class="text-white">--</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400">姓名:</span>
            <span id="pass-name" class="text-white">--</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400">票種與張數:</span>
            <span id="pass-details" class="text-emerald-400 font-bold">--</span>
          </div>
        </div>

        <button onclick="window.print()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-3 rounded-xl border border-slate-600 text-sm font-semibold">
          <i class="fa-solid fa-print mr-2"></i> 列印 / 存為 PDF 憑證
        </button>
      </div>
    </div>
  </main>

  <script>
    // 預設資料初始化
    function getDB() {
      return JSON.parse(localStorage.getItem('tku_concert_db')) || {
        inventory: { '1F': 1200, '2F': 300 },
        orders: []
      };
    }
    function saveDB(db) { localStorage.setItem('tku_concert_db', JSON.stringify(db)); }

    function updateCounter() {
      const db = getDB();
      document.getElementById('floor1-left').innerText = db.inventory['1F'];
      document.getElementById('floor2-left').innerText = db.inventory['2F'];
    }

    document.getElementById('ticket-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const studentId = document.getElementById('student-id').value.trim().toUpperCase();
      const name = document.getElementById('student-name').value.trim();
      const seat = document.getElementById('seat-type').value;
      const qty = parseInt(document.getElementById('ticket-qty').value);

      const db = getDB();

      // 檢查個人累積上限 (4張)
      const userOrders = db.orders.filter(o => o.studentId === studentId);
      const currentClaimed = userOrders.reduce((sum, o) => sum + o.qty, 0);

      if (currentClaimed + qty > 4) {
        alert(`索票失敗！學號 ${studentId} 已索取 ${currentClaimed} 張，每人上限最多 4 張。`);
        return;
      }

      // 檢查剩餘數量
      if (db.inventory[seat] < qty) {
        alert(`該區域剩餘票數不足！剩餘：${db.inventory[seat]} 張`);
        return;
      }

      // 建立訂單
      const passId = 'TKU2026-' + Math.floor(100000 + Math.random() * 900000);
      const newOrder = {
        passId,
        studentId,
        name,
        seat: seat === '1F' ? '一樓自由站立席' : '二樓自由座席',
        qty,
        claimedPaperTicket: false,
        createdAt: new Date().toLocaleString()
      };

      db.inventory[seat] -= qty;
      db.orders.push(newOrder);
      saveDB(db);

      // 顯示結果
      document.getElementById('pass-id').innerText = passId;
      document.getElementById('pass-student-id').innerText = studentId;
      document.getElementById('pass-name').innerText = name;
      document.getElementById('pass-details').innerText = `${newOrder.seat} x ${qty} 張`;
      
      document.getElementById('booking-section').classList.add('hidden');
      document.getElementById('pass-container').classList.remove('hidden');
      updateCounter();
    });

    updateCounter();
  </script>
</body>
</html>
