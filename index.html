<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖淡江至校園演唱會 - 線上索票系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>

  <!-- 1. 載入 Firebase SDK (v8 輕量版) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="min-h-screen pb-12">
  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur fixed top-0 w-full z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-holly-berry text-2xl text-emerald-400"></i>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-red-400 via-amber-200 to-emerald-400 bg-clip-text text-transparent">聖淡江至校園演唱會</h1>
          <p class="text-xs text-slate-400">淡江大學活動中心 ｜ 2,000席限定</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 pt-24 space-y-8">
    <!-- Banner -->
    <div class="glass-card rounded-2xl p-6 md:p-8 text-center relative overflow-hidden border-amber-500/30">
      <h2 class="text-3xl md:text-5xl font-black text-white tracking-wide mb-2">2026 聖淡江至演唱會</h2>
      <p class="text-slate-300 text-sm md:text-base max-w-xl mx-auto mb-6">請輸入學號完成線上登記，憑系統生成的領票憑證與學生證至指定地點領取實體
